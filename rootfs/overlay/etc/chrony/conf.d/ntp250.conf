# NTP250 reference clocks: GPS time of day from gpsd (NMEA), second
# boundaries from the u-blox timepulse on /dev/pps0.  PPS reaches chrony
# only here; gpsd is not given /dev/pps0.

# gpsd shared memory unit 0.  Used only to number the PPS seconds.
# Offset: median of 12 five-minute chrony readings against PPS over 1 h,
# 2026-11-02 (+40..+48 ms; NOTES.md "GPS configuration").
refclock SHM 0 refid NMEA offset 0.043 delay 0.2 noselect

# Rising edge of the timepulse (stock ntpd: driver 22, assert edge).
refclock PPS /dev/pps0 lock NMEA refid PPS prefer poll 4

# Serve NTP to any client, as the stock NTP ACL did.
allow
