name: release

# The kernel and ntp250-config packages built on every push to main and
# every pull request to it, so a change that breaks packaging shows
# before a tag; released only for a v* tag (the release and
# trigger-apt-repo jobs' ifs).  Every release carries both packages:
# apt-repo takes each repository's latest release only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  kernel:
    # Native arm64: no cross compiler.
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # The kernel package is named by its release and LINUX_INPUTS_SHA256
    # (image/sources.sh), which image/build.sh checks against the inputs:
    # a cache hit is the same package.
    - name: Cache key
      id: key
      run: |
        source image/sources.sh
        echo "key=linux-image-$LINUX_VERSION$LINUX_LOCALVERSION-$LINUX_INPUTS_SHA256" >>"$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      id: cache
      with:
        path: build/deb/linux-image-*.deb
        key: ${{ steps.key.outputs.key }}

    - name: Build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q bc bison flex libssl-dev libelf-dev kmod

    # With the package cached, the kernel stage only checks the inputs.
    - name: Build kernel
      run: image/build.sh kernel

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: linux-image
        path: build/deb/linux-image-*.deb

  deb:
    runs-on: ubuntu-latest
    steps:
    # Full history: the package version comes from git describe.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Lint
      run: shellcheck -S warning -x -P SCRIPTDIR image/build.sh image/rootfs-setup.sh package/build-ntp250-config.sh package/linux-image/* package/ntp250-config/preinst package/ntp250-config/postinst package/ntp250-config/prerm package/ntp250-config/postrm package/ntp250-config/root/usr/sbin/* package/ntp250-config/root/usr/share/kernel/*/*

    - name: Build ntp250-config
      run: package/build-ntp250-config.sh out

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ntp250-config
        path: out/*.deb

  release:
    needs: [kernel, deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        path: out
        merge-multiple: true

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      # A tag with a hyphen (v1.2.0-rc.1) is a pre-release: apt-repo
      # takes each repository's latest release, never a pre-release.
      run: |
        prerelease=()
        [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
        gh release create "$GITHUB_REF_NAME" out/*.deb -R "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"

  trigger-apt-repo:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
    # workflow_dispatch, not repository_dispatch: the token then needs
    # Actions: write on apt-repo instead of Contents: write.
    - name: Trigger APT repo rebuild
      env:
        GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
      run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
