#!/usr/sbin/nft -f
# NTP250 firewall (nftables.service).  Input: NTP, SSH, chronymon-web,
# mDNS, ICMP, DHCP, replies and site rules; the rest dropped and
# counted.  Output open.  NTP is not connection tracked, as stock
# cc_firewall (NOTRACK on UDP 123).  Site rules: /etc/nftables.d/*.nft,
# added to chain inet filter site.

flush ruleset

table inet raw {
	chain prerouting {
		type filter hook prerouting priority raw; policy accept;
		udp dport 123 notrack
	}

	chain output {
		type filter hook output priority raw; policy accept;
		udp sport 123 notrack
	}
}

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 123 accept
		tcp dport 22 accept
		tcp dport 8323 accept
		udp dport 5353 accept
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
		jump site
		counter comment "dropped by policy"
	}

	# Site rules (/etc/nftables.d/*.nft): accept here; return drops.
	chain site {
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
